<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Web Dashers</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#ddd;font:15px system-ui,sans-serif}p{padding:20px}</style></head>
<body><p>Loading Web Dashers…</p><script>
var MIRROR = "https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@main/";
// script → [what to find, what to put instead]
var PATCHES = {
  'assets/scripts/core/main.js': [/powerPreference:\s*"default"/, 'powerPreference: "high-performance"'],
  'assets/scripts/core/game-scene.js': [/levelCoinRequirements\[levelId\]\s*\|\|\s*0/, '0'],
};
var files = Object.keys(PATCHES);
Promise.all([fetch(MIRROR + 'index.html').then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })].concat(files.map(function (f) {
  return fetch(MIRROR + f).then(function (r) { return r.ok ? r.text() : null; }, function () { return null; });
}))).then(function (got) {
  var html = got[0];
  html = html.replace(/https:\/\/web-dashers\.github\.io\//g, MIRROR);
  html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + MIRROR + '">');
  files.forEach(function (f, i) {
    var js = got[i + 1], p = PATCHES[f];
    if (!js || !p[0].test(js)) return;
    var src = URL.createObjectURL(new Blob([js.replace(p[0], p[1])], { type: 'text/javascript' }));
    html = html.replace(new RegExp('src="' + f.replace(/[.\/]/g, '\\$&') + '[^"]*"'), 'src="' + src + '"');
  });
  document.open(); document.write(html); document.close();
  addEventListener('pointerdown', function () { window.focus(); }, true);
}).catch(function (e) {
  document.body.innerHTML = '<p>Couldn’t load Web Dashers from its mirror (cdn.jsdelivr.net).<br>' + e + '</p>';
});
</script></body></html>
